[workspace]
resolver = "2"
members = [
  "crates/fontina-core",
  "crates/fontina-platform",
  "crates/fontina-cli",
]
# The fuzz crate is its own workspace: it needs nightly and a sanitizer runtime, and
# nothing it depends on may reach the shipped binary. See fuzz/Cargo.toml.
exclude = ["fuzz"]

[workspace.package]
version = "0.1.2"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-or-later"
repository = "https://github.com/oddurs/fontina"
homepage = "https://github.com/oddurs/fontina"
authors = ["Oddur Sigurdsson"]
readme = "README.md"
keywords = ["font", "opentype", "typography", "font-manager", "woff2"]
categories = ["command-line-utilities", "text-processing", "multimedia"]

[workspace.dependencies]
fontina-core = { path = "crates/fontina-core" }
fontina-platform = { path = "crates/fontina-platform" }

skrifa = "0.46"
read-fonts = "0.43"
woff2-patched = "0.4"
flate2 = "1"
blake3 = "1"
walkdir = "2"
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Config is TOML, per PLAN.md §4: human-editable, and the format the standards
# inventory already commits to.
toml = "1"
schemars = "1"
thiserror = "2"
anyhow = "1"
directories = "6"
unicode-script = "0.5"
unicode-blocks = "0.1"
unicode-width = "0.2"
base64 = "0.22"
time = { version = "0.3", features = ["formatting"] }
clap = { version = "4", features = ["derive", "wrap_help", "env"] }
insta = { version = "1", features = ["json"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
opt-level = 3
