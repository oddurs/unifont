# GNU/Linux is the reference platform, and it is not one system. This workflow proves
# the binary actually manages fonts on several distributions, with fontconfig as the
# witness: after `fontina activate`, `fc-list` and `fc-match` have to see the font, the
# way any other program on the desktop would.
#
# ci.yml runs the unit and integration tests on one Ubuntu runner. This runs the whole
# command-line surface end to end on Debian, Ubuntu, Fedora, Arch, Alpine (musl) and a
# system with no fontconfig installed at all. The same script, scripts/acceptance, is
# what a contributor runs on their own desktop, and scripts/test-distros drives it
# locally against the same images.
#
# The second half asks the same question of the .deb and .rpm the release workflow
# publishes. Those are built from `[package.metadata.deb]` and
# `[package.metadata.generate-rpm]` in crates/fontina-cli/Cargo.toml, and until now
# nobody had ever installed one: scripts/test-packages installs them with apt and dnf
# and runs scripts/acceptance against the fontina those put on PATH.
name: linux

on:
  pull_request:
    paths:
      - 'crates/**'
      - 'fixtures/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'scripts/acceptance'
      - 'scripts/test-distros'
      - 'scripts/test-packages'
      - 'scripts/package-acceptance'
      - '.github/workflows/linux.yml'
  push:
    branches: [main]
  schedule:
    # Distribution images move under us; a weekly run catches that without waiting for
    # someone to open a pull request.
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (static, musl)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: Swatinem/rust-cache@v2
      # Static, so one binary runs on every distribution in the matrix, including the
      # musl one, and the matrix measures the distribution rather than the toolchain.
      - run: cargo build --release --locked -p fontina-cli --target x86_64-unknown-linux-musl
      - uses: actions/upload-artifact@v4
        with:
          name: fontina-musl
          path: target/x86_64-unknown-linux-musl/release/fontina
          if-no-files-found: error

  acceptance:
    name: ${{ matrix.name }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        name: [debian, ubuntu, fedora, arch, alpine, bare]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: fontina-musl
          path: .
      - run: chmod +x fontina
      # Docker on the runner rather than a `container:` job, because actions/checkout
      # cannot run inside an Alpine container: its Node is built against glibc.
      - run: FONTINA_BIN=$PWD/fontina scripts/test-distros ${{ matrix.name }}

  # --- the packages, not the binary --------------------------------------------------

  packages-build:
    name: build (.deb, .rpm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The same container the contributor's `scripts/test-packages` uses, so what CI
      # builds and what a maintainer builds on a laptop are the same package. The build
      # runs the same two commands release.yml runs, over the same two manifests.
      - run: scripts/test-packages --build-only
      - uses: actions/upload-artifact@v4
        with:
          name: fontina-packages
          path: |
            target/pkg-test/*.deb
            target/pkg-test/*.rpm
          if-no-files-found: error

  packages:
    name: package (${{ matrix.name }})
    needs: packages-build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        name: [debian, ubuntu, fedora]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: fontina-packages
          path: dist
      - run: FONTINA_PKG_DIR=$PWD/dist scripts/test-packages ${{ matrix.name }}

  # The check branch protection can require. Everything above is path-filtered, so on a
  # pull request that touches none of those paths GitHub creates no run at all and reports
  # nothing — and an unreported required check is not a passing one, it is one that waits
  # for ever. #38 changed only PLAN.md and got exactly the eight checks already required.
  #
  # `if: always()` makes this report whatever the jobs above did, including nothing. A
  # skipped dependency is a pass, because the paths this workflow guards were untouched;
  # a failure or a cancellation is a failure. So a docs-only pull request goes green in
  # seconds without running six distributions and two package managers.
  #
  # `needs.*.result` covers every dependency listed below, so adding a job to `needs`
  # is enough — there is no second list to keep in step.
  gate:
    name: linux
    needs: [build, acceptance, packages-build, packages]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every job above either passed or did not need to run
        run: |
          results='${{ join(needs.*.result, " ") }}'
          echo "dependencies: $results"
          for r in $results; do
            case "$r" in
              success|skipped) ;;
              *) echo "::error::a job this gate stands for reported $r"; exit 1 ;;
            esac
          done
