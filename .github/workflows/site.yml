# Builds the web site in site/ and publishes it to GitHub Pages.
# Pull requests that touch the site only get the build; main also deploys.
name: site

on:
  push:
    branches: [main]
    paths: ['site/**', 'docs/adr/**', 'crates/fontina-cli/src/ui/snapshots/**', '.github/workflows/site.yml']
  pull_request:
    paths: ['site/**', 'docs/adr/**', 'crates/fontina-cli/src/ui/snapshots/**', '.github/workflows/site.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # page footers show the last commit date of their source
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - run: npm run build
        working-directory: site
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io
          SITE_BASE: /${{ github.event.repository.name }}
      # upload-pages-artifact drops every dot-directory, which loses .well-known/security.txt,
      # so the artifact is packed by hand. deploy-pages only needs it named github-pages.
      - run: tar --dereference --hard-dereference -cf "$RUNNER_TEMP/artifact.tar" -C site/dist .
      - uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

  deploy:
    name: deploy
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # The check branch protection can require. Everything above is path-filtered, so on a
  # pull request that touches none of those paths GitHub creates no run at all and reports
  # nothing — and an unreported required check is not a passing one, it is one that waits
  # for ever. #38 changed only PLAN.md and got exactly the eight checks already required.
  #
  # `if: always()` makes this report whatever the jobs above did, including nothing. A
  # skipped dependency is a pass, because the paths this workflow guards were untouched;
  # a failure or a cancellation is a failure. So a docs-only pull request goes green in
  # seconds without running an Astro build.
  #
  # `needs.*.result` covers every dependency listed below, so adding a job to `needs`
  # is enough — there is no second list to keep in step.
  gate:
    name: site
    needs: [build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every job above either passed or did not need to run
        run: |
          results='${{ join(needs.*.result, " ") }}'
          echo "dependencies: $results"
          for r in $results; do
            case "$r" in
              success|skipped) ;;
              *) echo "::error::a job this gate stands for reported $r"; exit 1 ;;
            esac
          done
